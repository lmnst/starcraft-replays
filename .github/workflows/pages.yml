name: Validate and publish replay archive
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'content/**'
      - 'scripts/**'
      - 'vendor/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile replay structure validator
        run: mkdir -p build && g++ -std=c++14 -O2 scripts/validate-replay.cpp -o build/validate-replay
      - name: Validate scripts, game archives and replay content
        run: |
          node --check site/app.js
          node --check site/viewer/pilot-bridge.js
          node --check site/viewer/archive-ui.js
          python scripts/build.py
          python -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

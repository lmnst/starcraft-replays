media:
  - name: replays
    label: Replay files (.rep)
    input: site/replays
    output: /replays
    extensions: [rep]
    rename: random
  - name: room-media
    label: Replay room files (.rep, .mp4, .webm)
    input: site/room-media
    output: /room-media
    extensions: [rep, mp4, webm]
    rename: random
content:
  - name: matches
    label: Matches
    type: collection
    path: content/matches
    format: json
    operations:
      rename: false
    filename: '{fields.id}.json'
    fields:
      - name: id
        label: Permanent match ID
        type: string
        required: true
        description: 'Use a unique lowercase ID, e.g. match-006. Never change an existing ID: replace the replay file instead.'
      - name: title_en
        label: English title
        type: string
        required: true
      - name: title_zh
        label: Chinese title
        type: string
        required: true
      - name: player1
        label: Player / bot 1
        type: string
        required: true
      - name: player2
        label: Opponent name (internal record only)
        type: string
        required: true
      - name: opponent_tier
        label: Opponent tier shown on website
        type: select
        options:
          values: [D, C, B, A, S]
      - name: bot_version
        label: Agnes iteration (e.g. v6)
        type: string
      - name: map_code
        label: Map code (H, B or D)
        type: string
      - name: replay_player1
        label: Original replay nickname for bot 1
        type: string
        description: 'Exact nickname stored in the replay, e.g. player1. Displayed as Player / bot 1 above.'
      - name: replay_player2
        label: Original replay nickname for bot 2
        type: string
        description: 'Exact nickname stored in the replay, e.g. compat2. Displayed using the opponent tier, not the internal bot name.'
      - name: map
        label: Map
        type: string
        required: true
      - name: replay
        label: Replay file
        type: file
        required: true
        options:
          media: replays
          extensions: [rep]
      - name: visible
        label: Show on website
        type: boolean
      - name: description_en
        label: English description (verified facts only)
        type: text
      - name: description_zh
        label: Chinese description
        type: text
      - name: result
        label: Result for player 1
        type: select
        options:
          values: [unknown, win, loss]
    view:
      primary: title_en
      fields: [title_en, map, visible]
  - name: replay-room
    label: Replay room / 对战效果
    type: collection
    path: content/replay-room
    format: json
    operations:
      rename: false
    filename: '{fields.id}.json'
    fields:
      - name: id
        label: Permanent replay ID
        type: string
        required: true
        description: 'A unique lowercase ID using letters, numbers and hyphens.'
      - name: title_en
        label: English title
        type: string
        required: true
      - name: title_zh
        label: Chinese title
        type: string
        required: true
      - name: type
        label: Playback format
        type: select
        required: true
        options:
          values: [replay, video]
        description: 'replay = interactive .rep with game audio; video = .mp4 or .webm.'
      - name: file
        label: Replay or video file
        type: file
        required: true
        options:
          media: room-media
          extensions: [rep, mp4, webm]
      - name: visible
        label: Show in replay room
        type: boolean
      - name: map
        label: Map (optional)
        type: string
      - name: bot_version
        label: Bot version (optional)
        type: string
      - name: player1
        label: Player / bot 1 (optional)
        type: string
      - name: player2
        label: Player / bot 2 (optional)
        type: string
      - name: replay_player1
        label: Original replay nickname for player 1 (optional)
        type: string
      - name: replay_player2
        label: Original replay nickname for player 2 (optional)
        type: string
      - name: description_en
        label: English notes (optional)
        type: text
      - name: description_zh
        label: Chinese notes (optional)
        type: text
    view:
      primary: title_en
      fields: [title_en, type, map, visible]
